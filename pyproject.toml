[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-auto"
version = "0.1.0"
description = "Pipeline de automatización avanzada de YouTube con IA (estrategia 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FranManuel95" }]

dependencies = [
    # LLMs
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",

    # Audio
    "elevenlabs>=1.10.0",

    # YouTube / Google
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # Procesamiento de video/audio
    "moviepy>=1.0.3",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",

    # Imagen
    "Pillow>=10.4.0",

    # HTTP / utilidades
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",

    # Datos / config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",

    # Ingesta de la documentación estratégica (.docx)
    "python-docx>=1.1.2",

    # CLI
    "typer>=0.12.5",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
yt-auto = "yt_auto.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
