    rationale: "Payroll para small business, $150-300/referido. Conversión alta en LLCs con empleados."
  - id: "mercury"
    rationale: "Banking para non-resident LLCs, popular en audiencia immigrant founder."
  - id: "novo"
    rationale: "Banking small business sin SSN. CPA $20-50/cuenta abierta."
  - id: "bluevine"
    rationale: "Banking + crédito para LLC."
  - id: "quickbooks"
    rationale: "Software contable, $5-25 por lead cualificado."
  - id: "bench"
    rationale: "Bookkeeping outsourced. Alta conversión small business."

